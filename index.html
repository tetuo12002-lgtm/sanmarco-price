<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d46">
<title>最新入荷の花</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2a24; --sub:#6b746e; --line:#e4e0d8;
    --accent:#2f5d46; --accent-soft:#e3ece6; --price:#b23a48;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --card:#1d2320; --ink:#eef1ef; --sub:#9aa39d; --line:#2c3430;
      --accent:#8fc3a5; --accent-soft:#24312a; --price:#ff8a96; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
    line-height:1.5}
  header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  @media (prefers-color-scheme: dark){ header{color:#10160f} }
  .shop{font-size:13px;opacity:.85;letter-spacing:.05em}
  h1{margin:0;font-size:21px;font-weight:700}
  .updated{font-size:12px;opacity:.9;margin-top:2px}
  .tools{position:sticky;top:var(--hh,78px);z-index:9;background:var(--bg);padding:10px 0 6px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:4px;margin:0 16px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .tab{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:15px;font-weight:700;padding:9px 0;border-radius:9px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .tab[aria-selected="true"]{color:#10160f} }
  .search{margin:0 16px;display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:0 12px}
  .search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;padding:11px 0}
  .search button{border:0;background:none;color:var(--sub);font-size:20px;padding:4px;display:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .chip[aria-pressed="true"]{color:#10160f} }
  main{padding:8px 16px 40px;max-width:720px;margin:0 auto}
  section{margin-top:18px}
  h2{font-size:17px;margin:0 0 6px;padding-left:10px;border-left:4px solid var(--accent);display:flex;align-items:baseline;gap:8px}
  h2 small{font-size:12px;color:var(--sub);font-weight:400}
  .list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .info{flex:1;min-width:0}
  .name{font-size:16px;font-weight:600;overflow-wrap:anywhere}
  .meta{font-size:12.5px;color:var(--sub);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .color{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:0 6px}
  .price{text-align:right;flex:none}
  .yen{font-size:20px;font-weight:700;color:var(--price);font-variant-numeric:tabular-nums}
  .unit{font-size:11.5px;color:var(--sub)}
  .care{flex:none;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);
    border-radius:999px;padding:5px 11px;white-space:nowrap}
  .notice{margin:10px 16px 0;padding:9px 12px;border-radius:10px;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
  .notice.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .notice b{color:var(--price)}
  .empty{text-align:center;color:var(--sub);padding:40px 16px}
  /* 写真がある花：名前を押すと写真が出る */
  .row.has-photo{cursor:pointer}
  .row.has-photo .name:after{content:"📷";font-size:13px;margin-left:6px;vertical-align:1px}
  .row.has-photo:active{background:var(--accent-soft)}
  .pv{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
  .pv[hidden]{display:none}
  .pv-box{background:var(--card);border-radius:16px;overflow:hidden;width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;position:relative}
  .pv-box img{width:100%;max-height:70vh;object-fit:contain;background:#000;display:block}
  .pv-cap{padding:12px 16px 14px}
  .pv-cap b{font-size:17px;display:block}
  .pv-cap span{font-size:12.5px;color:var(--sub)}
  .pv-x{position:absolute;top:8px;right:8px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1;cursor:pointer}
  footer{text-align:center;font-size:11.5px;color:var(--sub);padding:0 16px 32px}
  .seri{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:12px 14px;background:var(--card);border:2px solid var(--accent);border-radius:14px;color:var(--ink);text-decoration:none}
  .seri[hidden]{display:none}
  .seri .ic{font-size:26px}
  .seri b{display:block;font-size:16px}
  .seri small{display:block;font-size:12.5px;color:var(--sub)}
  .seri .go{margin-left:auto;font-size:22px;color:var(--accent)}
</style>
</head>
<body>
<header id="hd">
  <div class="shop" id="shop"></div>
  <h1>最新入荷の花</h1>
  <div class="updated" id="updated">読み込み中…</div>
</header>
<a class="seri" id="seriLink" href="seri.html" hidden>
  <span class="ic" aria-hidden="true">🪴</span>
  <span><b>セリの予約注文</b><small id="seriTxt">市場のセリに出る鉢花・観葉植物を予約できます</small></span>
  <span class="go" aria-hidden="true">›</span>
</a>
<script src="seri.js"></script>
<script>
(function(){
  var S=window.SERI; if(!S||!S.items||!S.items.length) return;
  var m=(S.title||'').match(/(\d+)月(\d+)日/); if(!m) return;
  var y=Number((S.made||'').slice(0,4))||new Date().getFullYear();
  var day=new Date(y,Number(m[1])-1,Number(m[2])); var dl=new Date(day.getTime()); dl.setDate(dl.getDate()-1); dl.setHours(16,0,0,0);
  if(Date.now()>dl.getTime()) return;
  var WD='日月火水木金土';
  document.getElementById('seriTxt').textContent=(day.getMonth()+1)+'月'+day.getDate()+'日（'+WD[day.getDay()]+'）のセリ・'+S.items.length+'品　締切 '+(dl.getMonth()+1)+'/'+dl.getDate()+' 16時';
  document.getElementById('seriLink').hidden=false;
})();
</script>
<div class="tools" id="tools">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="kiri" aria-selected="true">切花</button>
    <button class="tab" role="tab" data-t="nae" aria-selected="false">花苗・鉢物</button>
  </div>
  <label class="search">
    <span aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="花の名前・色で探す" autocomplete="off">
    <button id="clear" type="button" aria-label="クリア">×</button>
  </label>
  <div class="notice" id="notice" hidden></div>
  <div class="chips" id="chips"></div>
</div>
<main id="list"></main>
<footer>入荷状況により売り切れの場合がございます。</footer>
<div class="pv" id="pv" hidden role="dialog" aria-modal="true" aria-label="花の写真">
  <div class="pv-box">
    <button class="pv-x" id="pvx" type="button" aria-label="閉じる">×</button>
    <img id="pvimg" alt="">
    <div class="pv-cap"><b id="pvname"></b><span id="pvnote"></span></div>
  </div>
</div>

<script>
(function(){
  var SHOP = "サンマルコ";
  document.getElementById("shop").textContent = SHOP;
  document.title = SHOP + " 最新入荷の花";

  // ?t=nae で開くと「花苗・鉢物」タブから表示する
  var state = { q: "", cat: "", tab: /[?&]t=nae\b/.test(location.search) ? "nae" : "kiri" };
  var data = null, prices = null, nae = null;
  var NAE_DAYS = 21;   // 花苗は直近3週間の入荷を表示

  // 花苗の名前に含まれる言葉 → 育て方ページ（care.html?id=）。上から順に探す
  var CARE = [["エリカ","calluna"],["カルーナ","calluna"],["カランコエ","kalanchoe"],["カリガネ","karigane"],
    ["カリオプテリス","karigane"],["キキョウ","kikyo"],["コスモス","cosmos"],["シクラメン","cyclamen"],["ビオラ","viola"],
    ["ファレノ","kochoran"],["コチョウラン","kochoran"],["胡蝶蘭","kochoran"],["ペンタス","pentas"],["リンドウ","rindo"],
    ["コバルトセージ","cobaltsage"],["トウガラシ","togarashi"],["唐辛子","togarashi"],["パンジー","pansy"],
    ["ストック","stock"],["ストツク","stock"],["ハボタン","habotan"],["葉牡丹","habotan"],
    ["ポインセチア","poinsettia"],["カラー","calla"]];

  // ===== 店内限定の価格表示（切花のみ） =====
  // レジ横のQR（URLの #k=鍵）を読むと、そのスマホで1時間だけ価格を表示する。
  // 価格は data.js に暗号化して入っていて（enc）、この鍵がないと読めない。
  var KEY_STORE = "sanmarco-price-key", SHOW_MS = 60 * 60 * 1000;
  var m = location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/);
  if (m) {
    try { localStorage.setItem(KEY_STORE, JSON.stringify({ k: m[1], exp: Date.now() + SHOW_MS })); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);   // 鍵をアドレス欄に残さない
  }
  function storedKey(){
    try {
      var v = JSON.parse(localStorage.getItem(KEY_STORE) || "null");
      if (v && v.exp > Date.now()) return v;
      localStorage.removeItem(KEY_STORE);
    } catch (e) {}
    return m ? { k: m[1], exp: Date.now() + SHOW_MS } : null;
  }
  function b64(s){
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(s + "===".slice((s.length + 3) % 4)), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function unlock(){
    var v = storedKey();
    if (!v || !data.enc || !window.crypto || !crypto.subtle) return Promise.resolve(null);
    var raw = b64(data.enc);
    return crypto.subtle.importKey("raw", b64(v.k), "AES-CBC", false, ["decrypt"])
      .then(function(key){ return crypto.subtle.decrypt({ name: "AES-CBC", iv: raw.slice(0, 16) }, key, raw.slice(16)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); })
      .catch(function(){ return "bad"; });
  }
  var timer = null;
  function showNotice(){
    var v = storedKey(), n = $("notice");
    if (state.tab !== "kiri") { n.hidden = true; setHeaderHeight(); return; }
    n.hidden = false;
    if (prices === "bad") {
      n.className = "notice";
      n.textContent = "読み取ったQRが古くなっています。店内レジ横の新しいQRを読み取ってください。";
    } else if (prices && v) {
      var min = Math.max(1, Math.ceil((v.exp - Date.now()) / 60000));
      n.className = "notice on";
      n.innerHTML = "店内限定で価格を表示しています（あと<b>" + min + "分</b>）";
    } else {
      if (prices) { prices = null; render(); }   // 1時間たったら価格を消す
      n.className = "notice";
      n.textContent = "価格は、店内レジ横のQRを読み取ると1時間表示されます。";
      clearInterval(timer); timer = null;
    }
    setHeaderHeight();
  }
  var $ = function(id){ return document.getElementById(id); };
  var norm = function(s){ return (s || "").normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); }); };

  function setHeaderHeight(){ document.documentElement.style.setProperty("--hh", $("hd").offsetHeight + "px"); }
  addEventListener("resize", setHeaderHeight);

  function esc(s){ return String(s).normalize("NFKC").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // ===== 花の写真 =====
  // flowers.js の FLOWER_PHOTOS = {"ガーベラ": "f-xxxx.jpg", "ガーベラ シーマ": "f-yyyy.jpg", ...}（写真は flowers フォルダ）
  // 品名＋品種の写真 → 品名の写真 → 品名に含まれる名前の写真（「バラ スタンダード」→「バラ」）の順に探す
  var photoKeys = null;
  var key = function(s){ return norm(s).replace(/[\s・]/g, ""); };
  function findPhoto(name, vari){
    if (!photoKeys) {
      photoKeys = {};
      var fp = window.FLOWER_PHOTOS || {};
      Object.keys(fp).forEach(function(k){ photoKeys[key(k)] = fp[k]; });
    }
    var n = key(name), f;
    if (vari && (f = photoKeys[n + key(vari)])) return { f: f, exact: true };
    if ((f = photoKeys[n])) return { f: f };
    var best = "";
    Object.keys(photoKeys).forEach(function(k){ if (k.length > best.length && n.indexOf(k) >= 0) best = k; });
    return best ? { f: photoKeys[best] } : null;
  }
  // 写真がある行には data-p（写真ファイル）と data-n（表示名）を付ける
  function photoAttr(name, vari){
    var p = findPhoto(name, vari);
    if (!p) return "";
    return ' has-photo" data-p="' + esc(p.f) + '" data-x="' + (p.exact ? 1 : 0) + '" data-n="' + esc(vari ? name + "　" + vari : name);
  }
  function openPhoto(row){
    $("pvimg").src = "flowers/" + row.getAttribute("data-p");
    $("pvimg").alt = row.getAttribute("data-n");
    $("pvname").textContent = row.getAttribute("data-n");
    $("pvnote").textContent = row.getAttribute("data-x") === "1" ? "" : "写真は同じ種類のお花の一例です。色や形は入荷によって変わります。";
    $("pv").hidden = false;
  }
  function closePhoto(){ $("pv").hidden = true; $("pvimg").removeAttribute("src"); }

  // ===== 切花 =====
  function renderKiri(){
    var groups = [], map = {};
    var q = norm(state.q);
    data.items.forEach(function(it, i){
      // it = [品名, 品種, 色, 産地]（価格は data.enc に暗号化して別に入っている）
      it._i = i;
      if (state.cat && it[0] !== state.cat) return;
      if (q && norm(it.slice(0,4).join(" ")).indexOf(q) < 0) return;
      if (!map[it[0]]) { map[it[0]] = []; groups.push(it[0]); }
      map[it[0]].push(it);
    });
    var html = groups.map(function(g){
      return '<section><h2>' + esc(g) + '<small>' + map[g].length + '種</small></h2><div class="list">' +
        map[g].map(function(it){
          var meta = [];
          if (it[2]) meta.push('<span class="color">' + esc(it[2]) + '</span>');
          if (it[3]) meta.push('<span>' + esc(it[3]) + '産</span>');
          var p = prices && prices !== "bad" && prices[it._i];   // p = [単位, 税込価格]
          return '<div class="row' + photoAttr(it[0], it[1]) + '"><div class="info"><div class="name">' + esc(it[1] || it[0]) + '</div>' +
            (meta.length ? '<div class="meta">' + meta.join("") + '</div>' : '') + '</div>' +
            (p ? '<div class="price"><div class="yen">¥' + Number(p[1]).toLocaleString("ja-JP") + '</div>' +
                 '<div class="unit">' + esc(p[0]) + ' 税込</div></div>' : '') + '</div>';
        }).join("") + '</div></section>';
    }).join("");
    $("list").innerHTML = html || '<div class="empty">該当する花が見つかりません</div>';
  }

  // ===== 花苗・鉢物 =====
  // nae.js の NAE_DATA = [{d:"2026-10-06", items:[[品名, 品種, 大きさ], ...]}, ...]（1回の入荷が1件）
  function loadNae(){
    var cut = new Date(Date.now() - NAE_DAYS * 864e5), list = [];
    var cutStr = cut.getFullYear() + "-" + ("0" + (cut.getMonth() + 1)).slice(-2) + "-" + ("0" + cut.getDate()).slice(-2);
    (window.NAE_DATA || []).forEach(function(b){
      if (!b || !b.d || b.d < cutStr) return;
      (b.items || []).forEach(function(it){ list.push({ d: b.d, name: it[0] || "", vari: it[1] || "", size: it[2] || "" }); });
    });
    list.sort(function(a, b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });
    return list;
  }
  function careId(it){
    var s = norm(it.name + " " + it.vari);
    for (var i = 0; i < CARE.length; i++) if (s.indexOf(norm(CARE[i][0])) >= 0) return CARE[i][1];
    return "";
  }
  function dayLabel(d){
    var p = d.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    return (+p[1]) + "月" + (+p[2]) + "日（" + "日月火水木金土".charAt(dt.getDay()) + "）入荷";
  }
  function renderNae(){
    if (!nae.length) {
      $("list").innerHTML = '<div class="empty">ここ3週間の花苗・鉢物の入荷はありません。<br>入荷しだい、こちらでお知らせします。</div>';
      return;
    }
    var groups = [], map = {};
    var q = norm(state.q);
    nae.forEach(function(it){
      if (state.cat && norm(it.name) !== state.cat) return;
      if (q && norm(it.name + " " + it.vari + " " + it.size).indexOf(q) < 0) return;
      if (!map[it.d]) { map[it.d] = []; groups.push(it.d); }
      map[it.d].push(it);
    });
    var html = groups.map(function(d){
      return '<section><h2>' + dayLabel(d) + '<small>' + map[d].length + '品</small></h2><div class="list">' +
        map[d].map(function(it){
          var meta = [], id = careId(it);
          if (it.vari) meta.push('<span class="color">' + esc(it.vari) + '</span>');
          if (it.size) meta.push('<span>' + esc(it.size) + '</span>');
          return '<div class="row' + photoAttr(it.name, it.vari) + '"><div class="info"><div class="name">' + esc(it.name) + '</div>' +
            (meta.length ? '<div class="meta">' + meta.join("") + '</div>' : '') + '</div>' +
            (id ? '<a class="care" href="care.html?id=' + id + '">育て方 →</a>' : '') + '</div>';
        }).join("") + '</div></section>';
    }).join("");
    $("list").innerHTML = html || '<div class="empty">該当する苗が見つかりません</div>';
  }

  function render(){ if (state.tab === "nae") renderNae(); else renderKiri(); }

  function renderChips(){
    var cats = [], labels = {};
    if (state.tab === "nae") {
      nae.forEach(function(it){ var k = norm(it.name); if (!labels[k]) { labels[k] = it.name; cats.push(k); } });
    } else {
      data.items.forEach(function(it){ if (cats.indexOf(it[0]) < 0) { cats.push(it[0]); labels[it[0]] = it[0]; } });
    }
    $("chips").innerHTML = ['<button class="chip" data-c="" aria-pressed="true">すべて</button>']
      .concat(cats.map(function(c){ return '<button class="chip" data-c="' + esc(c) + '" aria-pressed="false">' + esc(labels[c]) + '</button>'; })).join("");
  }

  function showUpdated(){
    if (state.tab === "nae") {
      $("updated").textContent = nae.length ? "ここ3週間の入荷　全" + nae.length + "品" : "ここ3週間の入荷";
    } else {
      $("updated").textContent = data.updated + " 更新　全" + data.items.length + "品";
    }
  }

  function setTab(t){
    state.tab = t; state.cat = ""; state.q = ""; $("q").value = ""; $("clear").style.display = "none";
    $("q").placeholder = t === "nae" ? "苗の名前で探す" : "花の名前・色で探す";
    [].forEach.call(document.querySelectorAll(".tab"), function(b){ b.setAttribute("aria-selected", b.getAttribute("data-t") === t ? "true" : "false"); });
    history.replaceState(null, "", location.pathname + (t === "nae" ? "?t=nae" : ""));
    showUpdated(); renderChips(); render(); showNotice(); scrollTo({ top: 0 });
  }

  document.querySelector(".tabs").addEventListener("click", function(e){
    var b = e.target.closest(".tab"); if (b && b.getAttribute("data-t") !== state.tab) setTab(b.getAttribute("data-t"));
  });
  $("chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if (!b) return;
    state.cat = b.getAttribute("data-c");
    [].forEach.call(this.children, function(c){ c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
    render(); scrollTo({ top: 0 });
  });
  $("q").addEventListener("input", function(){ state.q = this.value; $("clear").style.display = this.value ? "block" : "none"; render(); });
  $("clear").addEventListener("click", function(){ $("q").value = ""; state.q = ""; this.style.display = "none"; render(); });
  $("list").addEventListener("click", function(e){
    if (e.target.closest("a")) return;   // 「育て方 →」はそのままリンク
    var r = e.target.closest(".row.has-photo"); if (r) openPhoto(r);
  });
  $("pv").addEventListener("click", function(e){ if (e.target === this || e.target.closest(".pv-x")) closePhoto(); });
  addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("pv").hidden) closePhoto(); });

  // data.js（切花）と nae.js（花苗）を毎回最新で読み込む（キャッシュ回避）
  function load(src){
    return new Promise(function(ok){
      var s = document.createElement("script");
      s.src = src + "?t=" + Date.now();
      s.onload = function(){ ok(true); };
      s.onerror = function(){ ok(false); };
      document.body.appendChild(s);
    });
  }
  Promise.all([load("data.js"), load("nae.js"), load("flowers.js")]).then(function(r){
    if (!r[0]) { $("updated").textContent = "データを読み込めませんでした"; return; }
    data = window.PRICE_DATA;
    nae = loadNae();
    setTab(state.tab);
    unlock().then(function(p){
      prices = p;
      if (p && state.tab === "kiri") render();
      showNotice();
      if (p && p !== "bad") {
        timer = setInterval(showNotice, 30000);
        document.addEventListener("visibilitychange", function(){ if (prices) showNotice(); });
      }
    });
  });
  setHeaderHeight();
})();
</script>
</body>
</html>
