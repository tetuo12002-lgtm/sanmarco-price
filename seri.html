<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d46">
<title>セリの予約注文</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2a24; --sub:#6b746e; --line:#e4e0d8;
    --accent:#2f5d46; --accent-soft:#e3ece6; --price:#b23a48;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#141816; --card:#1d2320; --ink:#eef1ef; --sub:#9aa39d; --line:#2c3430;
      --accent:#8fc3a5; --accent-soft:#24312a; --price:#ff8a96; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;line-height:1.5}
  header{background:var(--accent);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  @media (prefers-color-scheme: dark){ header{color:#10160f} }
  .shop{font-size:13px;opacity:.85;letter-spacing:.05em}
  h1{margin:0;font-size:21px}
  .when{font-size:14px;margin-top:2px}
  .how{margin:14px 16px 4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
  .how ol{margin:6px 0 4px;padding-left:1.3em}.how li{margin:2px 0}
  .how .note{color:var(--sub);font-size:12.5px;margin:6px 0 0}
  main{padding:10px 16px calc(96px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line);cursor:zoom-in}
  .no{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:2px 10px;font-size:15px}
  @media (prefers-color-scheme: dark){ .no{color:#10160f} }
  .cnt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
  .info{padding:8px 10px 10px}
  .nm{font-weight:700;font-size:15px;line-height:1.35}
  .sb{color:var(--sub);font-size:13px}
  .pr{margin-top:4px;font-size:13px;color:var(--sub)}.pr b{color:var(--price);font-size:17px}
  .empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar a{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px;font-size:16px}
  @media (prefers-color-scheme: dark){ .bar a{color:#10160f} }
  .bar small{display:block;font-weight:400;font-size:12px;opacity:.9}
  #viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;overflow:auto;padding:50px 12px 20px}
  #viewer img{display:block;max-width:100%;margin:0 auto 12px;border-radius:6px}
  #viewer .x{position:fixed;top:8px;right:12px;font-size:32px;color:#fff;background:none;border:0;cursor:pointer}
  #viewer .cap{color:#fff;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="shop">フィオーレ・サンマルコ</div>
  <h1>セリの予約注文</h1>
  <div class="when" id="when"></div>
</header>
<section class="how">
  市場のセリに出る予定の鉢花・観葉植物です。ほしい品があれば、セリの前に予約してください。
  <ol>
    <li>写真の左上の<b>番号</b>を確かめる</li>
    <li>締切までに、お電話か店頭で番号と数をお伝えください</li>
    <li>落札できたら、ご連絡してお店でお渡しします</li>
  </ol>
  <p class="note">※セリなので、落札できないこともあります。値段は目安（税抜）で、落札の値段によって変わることがあります。写真は見本です。</p>
</section>
<main id="grid"></main>
<div class="bar"><a id="tel" href="tel:0116628125">📞 電話で予約する<small>011-662-8125（9:15〜18:00）</small></a></div>
<div id="viewer"><button class="x" aria-label="閉じる" onclick="closeV()">×</button><div id="vbox"></div></div>
<script src="seri.js"></script>
<script>
const S=window.SERI||{items:[]};
const g=document.getElementById('grid');
const m=(S.title||'').match(/(\d+)月(\d+)日/);
const WD='日月火水木金土';
let closed=false;
if(m){
  const y=Number((S.made||'').slice(0,4))||new Date().getFullYear();
  const day=new Date(y,Number(m[1])-1,Number(m[2]));
  const dl=new Date(day.getTime());dl.setDate(dl.getDate()-1);dl.setHours(16,0,0,0);
  closed=Date.now()>dl.getTime();
  document.getElementById('when').innerHTML=(day.getMonth()+1)+'月'+day.getDate()+'日（'+WD[day.getDay()]+'）のセリ<br>予約の締切：<b>'+(dl.getMonth()+1)+'月'+dl.getDate()+'日（'+WD[dl.getDay()]+'）16時まで</b>';
}
if(closed){
  document.querySelector('.how').insertAdjacentHTML('afterbegin','<p style="margin:0 0 8px;font-weight:700;color:var(--price)">このセリの予約受付は終わりました。次のセリの写真をお待ちください。</p>');
  document.querySelector('.bar').style.display='none';
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!S.items.length){g.innerHTML='<div class="empty">いまは予約できる品がありません</div>';}
S.items.forEach(it=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<img loading="lazy" alt="" src="'+esc(it.photos[0])+'"><span class="no">'+it.n+'</span>'+
    (it.photos.length>1?'<span class="cnt">写真'+it.photos.length+'枚</span>':'')+
    '<div class="info"><div class="nm">'+esc(it.name)+'</div><div class="sb">'+esc([it.sub,it.size].filter(Boolean).join('　'))+'</div>'+
    '<div class="pr">'+(it.price?'目安 <b>'+Number(it.price).toLocaleString()+'円</b>（税抜）':'値段はお問い合わせください')+'</div></div>';
  c.querySelector('img').onclick=()=>{vbox.innerHTML='<div class="cap">'+it.n+'番　'+esc(it.name)+'</div>'+it.photos.map(p=>'<img alt="" src="'+esc(p)+'">').join('');viewer.style.display='block';viewer.scrollTop=0;document.body.style.overflow='hidden'};
  g.appendChild(c);
});
function closeV(){viewer.style.display='none';document.body.style.overflow=''}
</script>
</body>
</html>
