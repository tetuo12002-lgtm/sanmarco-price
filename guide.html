<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d46">
<title>はじめての方へ</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2a24; --sub:#6b746e; --line:#e4e0d8;
    --accent:#2f5d46; --accent-soft:#e3ece6; --on-accent:#fff; --mark:#b23a48;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --card:#1d2320; --ink:#eef1ef; --sub:#9aa39d; --line:#2c3430;
      --accent:#8fc3a5; --accent-soft:#24312a; --on-accent:#10160f; --mark:#ff8a96; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
    line-height:1.6}
  header{position:sticky;top:0;z-index:10;background:var(--accent);color:var(--on-accent);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .shop{font-size:13px;opacity:.85;letter-spacing:.05em}
  h1{margin:0;font-size:21px;font-weight:700}
  .steps{display:flex;gap:4px;margin-top:8px}
  .steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
  .steps i.on{background:var(--on-accent)}
  main{padding:8px 16px 40px;max-width:720px;margin:0 auto}
  .lead{font-size:15px;margin:14px 0 4px}
  h2{font-size:19px;margin:18px 0 4px}
  .hint{font-size:13px;color:var(--sub);margin:0 0 10px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
  .opt:active{transform:scale(.99)}
  .opt .ico{font-size:28px;flex:none;width:36px;text-align:center}
  .opt .pic{flex:none;width:76px;height:76px;border-radius:12px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:34px}
  .opt .pic svg{width:72px;height:72px;display:block}
  .opt b{display:block;font-size:17px}
  .opt small{display:block;font-size:13px;color:var(--sub)}
  .opt .tag{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;color:var(--mark);
    border:1.5px solid var(--mark);border-radius:999px;padding:1px 8px;white-space:nowrap}
  .grid2{grid-template-columns:1fr 1fr}
  .grid2 .opt{justify-content:center;text-align:center;flex-direction:column;gap:2px;padding:14px 8px}
  .grid2 .opt .tag{margin:4px 0 0}
  .opt .cam{font-size:12px;color:var(--accent);font-weight:700;margin-top:2px}
  /* 参考写真 */
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet-in{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
    padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
  .sheet-in > b{display:block;font-size:18px;margin-bottom:10px}
  .sheet-in small{display:block;font-size:13px;color:var(--sub);margin-top:6px}
  .photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
  .photos figure{flex:none;width:100%;margin:0;scroll-snap-align:center;position:relative}
  .photos .view{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;border-radius:999px;padding:3px 10px}
  .photos .no{position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;border-radius:999px;padding:3px 12px;letter-spacing:.03em}
  .refno{display:inline-block;margin-top:6px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:2px 12px}
  .photos img{display:block;width:100%;max-height:56vh;object-fit:contain;background:var(--card);border-radius:12px}
  .size{margin-top:8px;text-align:center}
  .size b{display:inline-block;background:var(--accent-soft);border-radius:999px;padding:4px 12px;font-size:15px}
  .size span{display:block;font-size:13px;color:var(--sub);margin-top:4px}
  .ref{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;text-align:center}
  .ref img{max-width:100%;max-height:220px;border-radius:10px}
  .ref small{display:block;font-size:12px;color:var(--sub)}
  .back{margin-top:16px;background:none;border:0;color:var(--sub);font:inherit;font-size:14px;padding:8px 0;cursor:pointer}
  .note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
  .note b{display:block;margin-bottom:2px}
  .note ul{margin:0;padding-left:1.2em}
  .wait{background:var(--card);border:1.5px solid var(--mark)}
  .wait b{color:var(--mark)}
  .note a,details a{color:var(--accent);font-weight:700}
  /* スタッフに見せる画面 */
  .show{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:16px;margin-top:14px}
  .show .cap{font-size:13px;color:var(--sub);text-align:center}
  .show table{width:100%;border-collapse:collapse;margin-top:8px}
  .show th{text-align:left;font-size:14px;color:var(--sub);font-weight:400;padding:10px 0;width:5.5em;vertical-align:top}
  .show td{font-size:24px;font-weight:700;padding:8px 0;line-height:1.35}
  .show tr+tr th,.show tr+tr td{border-top:1px solid var(--line)}
  .links{display:grid;gap:10px;margin-top:10px}
  .link{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;color:var(--ink);text-decoration:none}
  .link .ico{font-size:24px}
  .link b{display:block}
  .link small{color:var(--sub);font-size:13px}
  .primary{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);
    font:inherit;font-size:17px;font-weight:700;padding:14px;cursor:pointer}
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px}
  summary{padding:14px 16px;font-weight:700;cursor:pointer}
  details .body{padding:0 16px 14px;font-size:14.5px}
  details ol,details ul{margin:0;padding-left:1.3em}
  footer{text-align:center;font-size:11.5px;color:var(--sub);padding:0 16px 32px}
</style>
</head>
<body>
<header>
  <div class="shop" id="shop"></div>
  <h1>はじめての方へ</h1>
  <div class="steps" id="steps"></div>
</header>
<main id="app"></main>
<footer>わからないことは、お気軽にスタッフへお声がけください。</footer>
<script src="photos.js"></script>
<script>

const sceneOf = () => (SCENES[state.p] || []).find(x => x.id===state.sc) || null;

/* 形 */

  hachi:    {ico:"🪴", name:"鉢花",       sub:"根があるので長く楽しめます"},

/* 形のイメージ図（お店の写真ができたら差し替え） */
const LEAF = "#5f9a6c", STEM = "#4f7f5a";
function fl(x, y, r, c){
  let s = "";
  for(let i = 0; i < 5; i++){ const a = (i*72 - 90) * Math.PI / 180;
    s += `<circle cx="${(x + r*.62*Math.cos(a)).toFixed(1)}" cy="${(y + r*.62*Math.sin(a)).toFixed(1)}" r="${(r*.5).toFixed(1)}" fill="${c}"/>`; }
  return s + `<circle cx="${x}" cy="${y}" r="${(r*.32).toFixed(1)}" fill="#f2c14e"/>`;
}
function kiku(x, y, r, c){
  let s = "";
  for(let i = 0; i < 12; i++) s += `<ellipse cx="${x}" cy="${y - r*.55}" rx="${(r*.2).toFixed(1)}" ry="${(r*.5).toFixed(1)}" fill="${c}" transform="rotate(${i*30} ${x} ${y})"/>`;
  return s + `<circle cx="${x}" cy="${y}" r="${(r*.3).toFixed(1)}" fill="${c}" stroke="rgba(0,0,0,.15)"/>`;
}
function leaf(x, y, rot, l = 9){
  return `<ellipse cx="${x}" cy="${y}" rx="${(l*.38).toFixed(1)}" ry="${l}" fill="${LEAF}" transform="rotate(${rot} ${x} ${y})"/>`;
}
function butsuBunch(cx){
  return `<g stroke="${STEM}" stroke-width="1.4">${[-6,-3,0,3,6].map(d => `<line x1="${cx+d}" y1="30" x2="${cx+d/3}" y2="72"/>`).join("")}</g>
    ${leaf(cx-9,34,-35,8)}${leaf(cx+9,34,35,8)}${leaf(cx-7,46,-25,7)}${leaf(cx+7,46,25,7)}
    ${kiku(cx,12,7,"#f3f0e6")}${kiku(cx-7,24,7,"#f2c14e")}${kiku(cx+7,24,7,"#b07cc6")}${kiku(cx,34,7,"#e0707a")}
    <rect x="${cx-5}" y="58" width="10" height="5" rx="1.5" fill="#9a7b4f"/>`;
}
const PICS = {
  hanataba: `<svg viewBox="0 0 80 80" aria-hidden="true">
    ${leaf(22,30,-40)}${leaf(58,28,40)}${leaf(40,20,0,8)}
    ${fl(28,26,9,"#e8768a")}${fl(47,19,10,"#f2a65a")}${fl(56,33,8,"#b07cc6")}${fl(38,34,8,"#f7d0d8")}${fl(21,40,7,"#e8768a")}
    <path d="M14 38 L66 38 L45 74 L35 74 Z" fill="#f1e4cf" stroke="#cdb896" stroke-width="1.2"/>
    <path d="M20 38 L40 38 L38 74 L35 74 Z" fill="#f5cdd3" opacity=".85"/>

  </svg>`,

    <path d="M16 50 Q40 2 64 50" fill="none" stroke="#a6763f" stroke-width="3.5" stroke-linecap="round"/>
    ${leaf(15,44,-60)}${leaf(65,44,60)}${leaf(40,34,0,8)}
    ${fl(24,42,8,"#e8768a")}${fl(40,36,9,"#f2a65a")}${fl(56,42,8,"#b07cc6")}${fl(32,47,6,"#f7d0d8")}${fl(48,47,6,"#f7d0d8")}
    <path d="M12 50 L68 50 L61 74 L19 74 Z" fill="#c8965a"/>
    <g stroke="#a6763f" stroke-width="1.3"><line x1="14" y1="57" x2="66" y2="57"/><line x1="16" y1="64" x2="64" y2="64"/><line x1="18" y1="70" x2="62" y2="70"/></g>
    <rect x="10" y="48" width="60" height="5" rx="2.5" fill="#a6763f"/>
  </svg>`,
  butsuka: `<svg viewBox="0 0 80 80" aria-hidden="true">${butsuBunch(22)}${butsuBunch(58)}</svg>`,
  hachi: `<svg viewBox="0 0 80 80" aria-hidden="true">
    <g stroke="${STEM}" stroke-width="1.6"><line x1="40" y1="46" x2="30" y2="22"/><line x1="40" y1="46" x2="42" y2="16"/><line x1="40" y1="46" x2="53" y2="24"/></g>
    ${leaf(28,40,-55,10)}${leaf(52,40,55,10)}${leaf(34,34,-25,8)}${leaf(47,33,25,8)}
    ${fl(30,22,8,"#e0566b")}${fl(42,15,8,"#e0566b")}${fl(53,24,8,"#e0566b")}
    <path d="M24 50 L56 50 L51 74 L29 74 Z" fill="#c96f4a"/>
    <rect x="21" y="46" width="38" height="7" rx="2" fill="#b35d3b"/>
  </svg>`,
};
const STYLE_BY_PURPOSE = {
  oiwai:  ["hanataba","arrange","hachi","omakase"],
  gift:   ["hanataba","arrange","hachi","omakase"],
  sonae:  ["arrange","hanataba","butsuka","omakase"],
  mimai:  ["arrange","hanataba","omakase"],
  jitaku: ["hanataba","hachi","arrange","omakase"],
};

/* 予算（popular=よく選ばれる） */
const BUDGETS = [1000,2000,3000,5000,7000,10000,20000,30000];
function popular(p, s){
  if(s==="hanataba") return [3000];
  if(s==="arrange")  return [5000];
  if(p==="sonae")    return [3000,5000];
  return [];
}
function budgetRange(p){
  if(p==="sonae") return "お供えは 3,000円〜10,000円 がよく選ばれています。";
  if(p==="oiwai") return "お祝いは 1,000円〜30,000円 と幅広く、贈る相手や場面で選ばれています。";
  return "花束は 3,000円、アレンジは 5,000円 がいちばんよく選ばれています。";
}

/* 色・雰囲気 */
const COLORS = {
  default: ["おまかせ","明るく元気に","やさしい淡い色","赤・ピンク系","黄・オレンジ系","白・グリーン系"],
  sonae:   ["おまかせ","白・グリーン中心","白に淡い色を少し","故人の好きな色で"],
};

/* 用途ごとの気をつけること */
const NOTES = {
  sonae: ["白や淡い色が中心になります（四十九日を過ぎたら色を入れることもあります）","トゲのある花や香りの強い花は控えるのが一般的です","名札（立札）を付けられます。贈り主のお名前をお伝えください","札幌市内（定山渓を除く）へ配達できます。3,300円（税込）から、西区は配達無料"],
  mimai: ["鉢植えは「根付く＝寝付く」として避けるのが一般的です","香りの強い花・花粉が落ちる花は控えめにします","病院によっては生花を持ち込めないことがあります。事前にご確認ください","そのまま飾れるアレンジが喜ばれます"],
  oiwai: ["開店・開業祝いには名札（立札）を付けられます","メッセージカードもご用意できます","札幌市内（定山渓を除く）へ配達できます。3,300円（税込）から、西区は配達無料"],
  gift:  ["メッセージカードもご用意できます","渡すまで時間があるときはお伝えください。水を含ませてお包みします"],
  jitaku:["お好きな花を1本から選べます","ご予算を伝えていただければ、その金額でまとめます"],
};

const state = {p:null, sc:null, s:null, b:null, c:null};
const colorList = () => { const sc = sceneOf(); return (sc && sc.colors) || COLORS[state.p==="sonae" ? "sonae" : "default"]; };
const app = document.getElementById("app");
const esc = t => String(t).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const yen = n => n.toLocaleString("ja-JP") + "円";

function steps(n){
  document.getElementById("steps").innerHTML = [1,2,3,4,5,6].map(i => `<i class="${i<=n?"on":""}"></i>`).join("");
}
function go(step){ history.pushState({step, ...state}, ""); render(step); }
window.addEventListener("popstate", e => {
  const st = e.state || {step:0};
  Object.assign(state, {p:st.p||null, sc:st.sc||null, s:st.s||null, b:st.b||null, c:st.c ?? null});
  render(st.step || 0);
});
function back(){ history.back(); }
const pName = () => PURPOSES.find(x => x.id===state.p).name;

/* 参考写真（photos.js に登録したものだけ表示） */
const PHOTOS = window.PHOTOS || {};
const SIZES = window.SIZES || {};
/* 写真のお花の大きさ（photos.js の SIZES）。500mlペットボトル（高さ約20cm）何本分かも添える */
/* 写真の番号（photos.js の SIZES の no）。電話で写真を伝えてもらうため */
function photoNo(f){ return SIZES[f] && SIZES[f].no ? SIZES[f].no : ""; }
function sizeHtml(f){
  const z = SIZES[f];
  if(!z || !(z.h || z.w)) return "";
  const parts = [];
  if(z.h) parts.push(`高さ 約${z.h}cm`);
  if(z.w) parts.push(`幅 約${z.w}cm`);
  const n = z.h ? Math.round(z.h / 20 * 2) / 2 : 0;
  const cmp = n >= 1 ? `500mlのペットボトル（約20cm）の約${n}本分の高さ` : "";
  return `<div class="size"><b>📏 ${parts.join(" × ")}</b>${cmp ? `<span>${cmp}</span>` : ""}</div>`;
}
function photosFor(b){
  return PHOTOS[`${state.p}-${state.s}-${b}`] || PHOTOS[`${state.s}-${b}`] || [];
}
function pickBudget(b){
  const ps = photosFor(b);
  if(!ps.length){ state.b = b; go(5); return; }
  const box = document.createElement("div");
  box.className = "sheet";
  box.onclick = e => { if(e.target === box) closeSheet(); };
  box.innerHTML = `<div class="sheet-in">
    <b>${yen(b)}の${esc(STYLES[state.s].name)}の例</b>
    <div class="photos">${ps.map(f => `<figure><img src="photos/${esc(f)}" alt="${yen(b)}の${esc(STYLES[state.s].name)}の参考写真" loading="lazy">${SIZES[f] && SIZES[f].t ? `<span class="view">${esc(SIZES[f].t)}</span>` : ""}${photoNo(f) ? `<span class="no">No.${photoNo(f)}</span>` : ""}${sizeHtml(f)}</figure>`).join("")}</div>
    ${ps.length > 1 ? `<small>横にずらすと、ほかの写真も見られます</small>` : ""}
    ${ps.some(photoNo) ? `<small>お電話でご注文のときは、写真の番号（No.）をお伝えください。</small>` : ""}
    <small>サンマルコでお作りしたものです。季節や入荷によって、花の種類や色は変わります。</small>
    <button class="primary" onclick="closeSheet();state.b=${b};go(5)">この金額にする</button>
    <button class="back" onclick="closeSheet()">← ほかの金額を見る</button></div>`;
  document.body.appendChild(box);
}
function closeSheet(){ document.querySelectorAll(".sheet").forEach(x => x.remove()); }

function render(step){
  closeSheet();
  steps(step);
  window.scrollTo(0,0);
  if(step===0){
    app.innerHTML = `
      <p class="lead">ご来店ありがとうございます。<br>花屋がはじめてでも大丈夫です。<b>5つの質問に答えるだけ</b>で、スタッフに伝える内容がまとまります。</p>
      <div class="note wait"><b>⏱ お作りするのに少しお時間をいただきます</b>花束は20分前後、アレンジは30分前後かかります。ご注文が混み合っているときは、もう少しお時間をいただく場合があります。お急ぎのときは、お電話でご予約いただくと待たずにお受け取りいただけます。</div>
      <button class="primary" onclick="go(1)">はじめる</button>
      ${extras()}`;
    return;
  }
  if(step===1){
    app.innerHTML = `<h2>① 何に使いますか？</h2><p class="hint">いちばん近いものを選んでください。</p>
      <div class="opts">${PURPOSES.map(x => `
        <button class="opt" onclick="state.p='${x.id}';go(2)"><span class="ico">${x.ico}</span>
        <span><b>${x.name}</b><small>${x.sub}</small></span></button>`).join("")}</div>
      <button class="back" onclick="back()">← もどる</button>`;
    return;
  }
  if(step===2){
    app.innerHTML = `<h2>② どんな場面ですか？</h2><p class="hint">${esc(pName())}の中で、いちばん近いものを選んでください。</p>
      <div class="opts">${(SCENES[state.p]||[]).map(x => `
        <button class="opt" onclick="state.sc='${x.id}';go(3)"><span class="ico">${x.ico}</span>
        <span><b>${x.name}</b><small>${x.sub}</small></span></button>`).join("")}
        <button class="opt" onclick="state.sc=null;go(3)"><span class="ico">💬</span>
        <span><b>ほかの場面・とくになし</b><small>この中にないときはこちら</small></span></button></div>
      <button class="back" onclick="back()">← もどる</button>`;
    return;
  }
  if(step===3){
    const sc = sceneOf(), rec = sc ? sc.rec : [];
    const order = [...rec, ...STYLE_BY_PURPOSE[state.p].filter(k => !rec.includes(k))];
    if(!order.includes("omakase")) order.push("omakase");
    app.innerHTML = `<h2>③ どんな形にしますか？</h2><p class="hint">${esc(sc ? sc.name : pName())}には、こんな形があります。</p>
      <div class="opts">${order.map(k => { const x = STYLES[k]; return `
        <button class="opt" onclick="state.s='${k}';go(4)"><span class="pic">${PICS[k]||x.ico}</span>
        <span><b>${x.name}</b><small>${x.sub}</small></span>${rec.includes(k)?'<span class="tag">おすすめ</span>':""}</button>`; }).join("")}</div>
      <button class="back" onclick="back()">← もどる</button>`;
    return;
  }
  if(step===4){
    const pop = popular(state.p, state.s);
    const list = state.p==="sonae" ? BUDGETS.filter(b => b>=2000 && b<=20000) : BUDGETS;
    app.innerHTML = `<h2>④ ご予算は？</h2><p class="hint">${budgetRange(state.p)}<br>金額に合わせてお作りします（税込）。</p>
      <div class="opts grid2">${list.map(b => `
        <button class="opt" onclick="pickBudget(${b})"><b>${yen(b)}</b>${pop.includes(b)?'<span class="tag">よく選ばれる</span>':""}${photosFor(b).length?'<span class="cam">📷 写真あり</span>':""}</button>`).join("")}
        <button class="opt" onclick="state.b='相談';go(5)"><b>相談したい</b></button></div>
      <button class="back" onclick="back()">← もどる</button>`;
    return;
  }
  if(step===5){
    const cs = colorList();
    app.innerHTML = `<h2>⑤ 色や雰囲気は？</h2><p class="hint">迷ったら「おまかせ」で大丈夫です。</p>
      <div class="opts grid2">${cs.map((c,i) => `
        <button class="opt" onclick="state.c=${i};go(6)"><b>${esc(c)}</b></button>`).join("")}</div>
      <button class="back" onclick="back()">← もどる</button>`;
    return;
  }
  if(step===6){
    const cs = colorList(), sc = sceneOf();
    const notes = NOTES[state.p] || [];
    app.innerHTML = `<h2>この画面をスタッフに見せてください</h2>
      <div class="show"><div class="cap">ご注文メモ</div><table>
        <tr><th>用途</th><td>${esc(pName())}</td></tr>
        ${sc ? `<tr><th>場面</th><td>${esc(sc.name)}</td></tr>` : ""}
        <tr><th>形</th><td>${esc(STYLES[state.s].name)}</td></tr>
        <tr><th>ご予算</th><td>${typeof state.b==="number" ? yen(state.b)+"くらい" : "相談したい"}</td></tr>
        <tr><th>色</th><td>${esc(cs[state.c])}</td></tr></table>
        ${typeof state.b==="number" && photosFor(state.b).length ? `<div class="ref"><img src="photos/${esc(photosFor(state.b)[0])}" alt="参考写真">${photoNo(photosFor(state.b)[0]) ? `<div><span class="refno">写真 No.${photoNo(photosFor(state.b)[0])}</span></div>` : ""}${sizeHtml(photosFor(state.b)[0])}<small>参考にした写真</small></div>` : ""}</div>
      ${sc ? `<div class="note"><b>${esc(sc.ico)} ${esc(sc.name)}のポイント</b><ul>${sc.tips.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
      ${notes.length ? `<div class="note"><b>${esc(pName())}で知っておくと安心なこと</b><ul>${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
      ${STYLES[state.s].wait ? `<div class="note wait"><b>⏱ お作りするのに ${STYLES[state.s].wait} かかります</b>ご注文をいただいてから1つずつお作りします。ご注文が混み合っているときは、もう少しお時間をいただく場合があります。お急ぎのときは、先にお電話（<a href="tel:0116628125">011-662-8125</a>）でご予約いただくと、待たずにお受け取りいただけます。</div>` : ""}
      <button class="primary" onclick="history.go(-6)">最初からやり直す</button>
      ${extras()}`;
  }
}

function extras(){
  return `<h2>お店の情報</h2>
    <div class="links">
      <div class="link"><span class="ico">🕘</span><span><b>営業時間 9:15〜18:00</b><small>定休日：不定休</small></span></div>
      <a class="link" href="tel:0116628125"><span class="ico">📞</span><span><b>011-662-8125</b><small>タップで電話がかかります</small></span></a>
    </div>
    <h2>そのほかのご案内</h2>
    <div class="links">
      <a class="link" href="./"><span class="ico">🌷</span><span><b>最新入荷の花</b><small>最新入荷のお花の一覧</small></span></a>
      <a class="link" href="care.html"><span class="ico">🪴</span><span><b>鉢花の育て方</b><small>水やり・置き場所など</small></span></a>
    </div>
    <details><summary>1本ずつ選んで作ってもらうには？</summary><div class="body"><ol>
      <li>店内やケースの中から好きな花を選びます</li>
      <li>「この花を○本」とスタッフに伝えます（決めきれなければ予算だけでもOK）</li>
      <li>用途を伝えると、合う花を足したりラッピングしたりしてまとめます</li></ol></div></details>
    <details><summary>切花を長持ちさせるコツ</summary><div class="body"><ul>
      <li>家に着いたら、茎の先を1〜2cm斜めに切ってから花瓶へ</li>
      <li>水は毎日かえて、花瓶もさっと洗うと長持ちします</li>
      <li>水につかる部分の葉は取ります（水が傷みやすくなるため）</li>
      <li>暖房やエアコンの風・直射日光の当たらない、涼しい場所に</li></ul></div></details>
    <details><summary>ご予約</summary><div class="body"><ul>
      <li>お電話（<a href="tel:0116628125">011-662-8125</a>）・FAX・ご来店で承ります</li>
      <li>お供えや開店祝いなど、日にちが決まっているものは早めのご予約が安心です</li>
      <li>お作りするのに、花束は20分前後・アレンジは30分前後かかります（混み合っているときはもう少しかかる場合があります）。ご予約いただくと、待たずにお受け取りいただけます</li></ul></div></details>
    <details><summary>配達</summary><div class="body"><ul>
      <li>札幌市内へお届けします（定山渓は除きます）</li>
      <li>ご注文は <b>3,300円（税込）</b> から承ります</li>
      <li>配達料：<b>西区は無料</b>、そのほかの区は <b>500円（税込）</b></li></ul></div></details>
    <details><summary>お支払い方法</summary><div class="body">
      <ul><li>現金</li><li>クレジットカード</li><li>Airペイ</li><li>QUICPay（クイックペイ）</li></ul></div></details>`;
}

history.replaceState({step:0}, "");
render(0);
</script>
